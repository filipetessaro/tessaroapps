<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlantScan AI — Legal</title>
<style>
  :root {
    --bg: #faf9f5;
    --text: #1f2a1f;
    --text-muted: #5c6b5c;
    --accent: #3f8f5c;
    --border: #ddd9cc;
    --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14180f; --text: #eef1e8; --text-muted: #9fae97; --accent: #6cbf8e; --border: #2c3426; }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
  }
  main { max-width: 420px; text-align: center; }
  h1 { font-family: var(--font-display); font-size: 28px; margin: 0 0 8px; }
  p { color: var(--text-muted); margin: 0 0 28px; }
  .links { display: flex; flex-direction: column; gap: 12px; }
  a.card {
    display: block;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
  }
  a.card:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>🌱 PlantScan AI</h1>
  <p>Legal documents</p>
  <div class="links">
    <a class="card" href="privacy/">Privacy Policy</a>
    <a class="card" href="terms/">Terms of Use</a>
  </div>
</main>
</body>
</html>
